// Jackson adapters: streaming record reader, JSON rule-catalog loader, result writer (ADR-0003).
plugins {
    id 'dq.library-conventions'
}

description = 'Data-quality rule engine: JSON (Jackson) adapters'

dependencies {
    api project(':engine-core')
    api platform(libs.jackson.bom)
    api libs.jackson.databind // JsonDataRecord.of(JsonNode) exposes Jackson types

    testImplementation testFixtures(project(':engine-core'))
}
