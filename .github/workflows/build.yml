# Builds and tests every push and pull request on the project's toolchain, Java 21 (ADR-0012).
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # --no-build-cache: always really run the tests (see the README's build-cache caveat).
      - run: ./gradlew build :engine-core:memoryTest --no-build-cache
